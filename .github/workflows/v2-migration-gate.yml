name: V2 core migration gate
on:
  push:
    branches: [feat/perfect-harness-v2-tui-windows]
    paths: [.github/workflows/v2-migration-gate.yml]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26.4.0'
      - run: npm install --package-lock-only
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        if: always()
        run: npm run lint
      - name: V1 regression with Node SQLite
        if: always()
        run: npm test
      - name: Build
        if: always()
        run: npm run build
      - name: Export generated lockfile and installed public type definitions
        if: always()
        run: |
          mkdir -p /tmp/v2-contracts
          cp package-lock.json /tmp/v2-contracts/
          cp node_modules/@opentui/core/package.json /tmp/v2-contracts/opentui-core-package.json
          find node_modules/@opentui/core node_modules/@opentui/react -name '*.d.ts' -exec cp --parents {} /tmp/v2-contracts/ \;
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-lock-and-types
          path: /tmp/v2-contracts
          retention-days: 3
