name: V3 escritorio Windows real
on:
  push:
    branches: [feat/perfect-harness-v3-integraciones]
    paths: [src/windows/**, src/integrations/**, tests/windows/**, scripts/desktop-smoke.mjs, scripts/prepare-desktop.ps1, .github/workflows/v3-native-desktop.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v3-desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    runs-on: windows-2025
    timeout-minutes: 12
    env:
      WINAPP_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26.4.0'
      - run: npm ci
      - name: Preparar módulos nativos fijados y ventana sin elevación
        shell: pwsh
        run: |
          ./scripts/prepare-desktop.ps1
          $csc=Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          $source=(Resolve-Path src/windows/CredentialVault.cs).Path
          & $csc /nologo /target:exe /platform:x64 '/out:assets/windows/desktop/Perfect.CredentialVault.exe' /reference:System.Security.dll $source
          if($LASTEXITCODE -ne 0){throw 'No compiló DPAPI'}
          $fixture=(Resolve-Path tests/windows/DesktopFixture.cs).Path
          & $csc /nologo /target:winexe /platform:x64 "/out:$env:RUNNER_TEMP/PerfectDesktopFixture.exe" /reference:System.Windows.Forms.dll /reference:System.Drawing.dll $fixture
          if($LASTEXITCODE -ne 0){throw 'No compiló la aplicación de prueba'}
          $launcher=(Resolve-Path tests/windows/StartUnelevated.cs).Path
          & $csc /nologo /target:exe /platform:x64 "/out:$env:RUNNER_TEMP/PerfectTestLauncher.exe" $launcher
          if($LASTEXITCODE -ne 0){throw 'No compiló el iniciador restringido de prueba'}
          "PERFECT_DESKTOP_FIXTURE=$env:RUNNER_TEMP/PerfectDesktopFixture.exe" | Out-File $env:GITHUB_ENV -Append
          "PERFECT_DESKTOP_LAUNCHER=$env:RUNNER_TEMP/PerfectTestLauncher.exe" | Out-File $env:GITHUB_ENV -Append
      - name: UIA, identidad de ventana, captura y revocación sin cuentas personales
        run: node --import tsx scripts/desktop-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V3-Escritorio-Windows-Evidencia
          path: test-results/desktop
          retention-days: 14
