name: V4 completion source gate (temporary)
on:
  push:
    branches: [feat/perfect-harness-v4-skills-studios]
    paths: [scripts/v4-finish-source.mjs, scripts/v4-source-preflight.mjs, .github/workflows/v4-completion-source.yml]
permissions:
  contents: write
concurrency:
  group: v4-completion-source
  cancel-in-progress: true
jobs:
  source:
    if: github.repository == 'vellxw/Perfect-harness' && github.ref == 'refs/heads/feat/perfect-harness-v4-skills-studios'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26.4.0'
      - run: npm ci
      - run: node scripts/v4-source-preflight.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm install --save-exact --ignore-scripts three@0.180.0
      - run: npx --no-install prettier --write src tests/skills tests/contract/skills-pi.test.ts tests/fake-provider/pi-service.ts tests/e2e/skills-workflow.test.ts tests/e2e/blender.test.ts tests/security/blender.test.ts
      - run: npm run generate:config
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:config
      - run: npm run build
      - run: npm test
      - run: npm run test:package
      - name: Prepare deterministic sandbox resources
        run: |
          docker pull node:24-bookworm-slim
          docker pull mcr.microsoft.com/playwright:v1.63.0-noble
          docker pull postgres:18.6-bookworm
      - run: npm run test:e2e
        env:
          PERFECT_TEST_DOCKER: '1'
          PERFECT_ARTIFACT_DIR: test-results
      - name: Stage tested source only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import pathlib,subprocess,json,base64,os
          names=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          names.update(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          names={n for n in names if n.startswith(('src/','tests/','examples/')) or n in ['package.json','package-lock.json','perfect.config.schema.json','perfect.config.example.json','scripts/prepare-blender.mjs']}
          entries=[]
          for name in sorted(names):
            p=pathlib.Path(name);assert p.is_file() and not p.is_symlink() and p.stat().st_size<6_000_000
            blob=json.loads(subprocess.check_output(['gh','api','--method','POST','repos/vellxw/Perfect-harness/git/blobs','--input','-'],input=json.dumps({'encoding':'base64','content':base64.b64encode(p.read_bytes()).decode()}),text=True))['sha']
            entries.append({'path':name,'mode':'100644','type':'blob','sha':blob})
          tree=json.loads(subprocess.check_output(['gh','api','--method','POST','repos/vellxw/Perfect-harness/git/trees','--input','-'],input=json.dumps({'base_tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'tree':entries}),text=True))['sha']
          pathlib.Path('test-results').mkdir(exist_ok=True)
          pathlib.Path('test-results/completion-tree.json').write_text(json.dumps({'parent':os.environ['GITHUB_SHA'],'tree':tree,'files':sorted(names)},indent=2))
          print('TESTED_TREE='+tree)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v4-completion-source
          path: test-results
          retention-days: 7
