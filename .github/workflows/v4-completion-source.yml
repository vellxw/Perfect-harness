name: V4 completion source gate (temporary)
on:
  push:
    branches: [feat/perfect-harness-v4-skills-studios]
    paths: [scripts/v4-completion-source.mjs, src/skills/**, tests/skills/**, .github/workflows/v4-completion-source.yml]
permissions:
  contents: write
concurrency:
  group: v4-completion-source
  cancel-in-progress: true
jobs:
  source:
    if: github.repository == 'vellxw/Perfect-harness' && github.ref == 'refs/heads/feat/perfect-harness-v4-skills-studios'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26.4.0'
      - run: npm ci
      - run: node scripts/v4-completion-source.mjs
      - run: npx --no-install prettier --write src tests/skills
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:config
      - run: npm run build
      - run: npm test
      - run: npm run test:package
      - name: Store tested source tree; do not move refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import pathlib,subprocess,json,base64,os
          names=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines();entries=[]
          for name in names:
            assert name.startswith(('src/','tests/'))
            p=pathlib.Path(name);assert p.is_file() and not p.is_symlink()
            blob=json.loads(subprocess.check_output(['gh','api','--method','POST','repos/vellxw/Perfect-harness/git/blobs','--input','-'],input=json.dumps({'encoding':'base64','content':base64.b64encode(p.read_bytes()).decode()}),text=True))['sha']
            entries.append({'path':name,'mode':'100644','type':'blob','sha':blob})
          tree=json.loads(subprocess.check_output(['gh','api','--method','POST','repos/vellxw/Perfect-harness/git/trees','--input','-'],input=json.dumps({'base_tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'tree':entries}),text=True))['sha']
          pathlib.Path('test-results').mkdir(exist_ok=True)
          pathlib.Path('test-results/completion-tree.json').write_text(json.dumps({'parent':os.environ['GITHUB_SHA'],'tree':tree,'files':names},indent=2))
          print('TESTED_TREE='+tree)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v4-completion-source
          path: test-results
          retention-days: 7
