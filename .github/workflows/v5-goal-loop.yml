name: Perfect Desktop V5 Goal Loop
on:
  push:
    branches: [feat/perfect-desktop-v5]
    paths:
      - 'src/**'
      - 'scripts/desktop/**'
      - '.github/workflows/v5-goal-loop.yml'
      - 'package*.json'
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: v5-goal-loop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  goal-loop:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26.4.0'
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run build:desktop
      - name: Prepare exact public sandbox images from an empty runner cache
        run: |
          docker pull node:24-bookworm-slim
          docker pull mcr.microsoft.com/playwright:v1.63.0-noble
      - run: node node_modules/playwright/cli.js install ffmpeg
      - name: Install Electron runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2t64
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Execute and record the real Desktop Goal Loop
        run: xvfb-run -a -s '-screen 0 1920x1080x24' node scripts/desktop/goal-loop-e2e.mjs
        env:
          PERFECT_ARTIFACT_DIR: test-results/desktop/goal-loop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v5-goal-loop-evidence
          path: test-results/desktop/goal-loop
          retention-days: 30
