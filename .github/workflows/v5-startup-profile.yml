name: V5 cold-start diagnosis
# Read-only maintainer diagnosis, never a publication gate or source generator.
on:
  push:
    branches: [feat/perfect-desktop-v5]
    paths: [scripts/desktop/startup-profile.mjs, .github/workflows/v5-startup-profile.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    strategy:
      fail-fast: false
      matrix:
        mode: [playwright-loader, explicit-executable]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26.4.0'
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run build:desktop
      - name: Prepare actual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2t64
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Capture first-ever launch without accepting or discarding it
        env:
          PROFILE_MODE: ${{ matrix.mode }}
        run: |
          if [ "$PROFILE_MODE" = explicit-executable ]; then
            xvfb-run -a -s '-screen 0 1920x1080x24' node scripts/desktop/startup-profile.mjs --explicit-executable
          else
            xvfb-run -a -s '-screen 0 1920x1080x24' node scripts/desktop/startup-profile.mjs
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v5-startup-profile-${{ matrix.mode }}
          path: test-results/desktop/startup-profile-*
          retention-days: 14
