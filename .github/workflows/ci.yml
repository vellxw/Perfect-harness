name: CI
on:
  push:
    branches: [main, feat/perfect-harness-v1]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        run: if test -f package-lock.json; then npm ci; else npm install; fi
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npx eslint src tests
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-lock
          path: package-lock.json
