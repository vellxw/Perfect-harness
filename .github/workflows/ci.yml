name: CI
on:
  push:
    branches: [main, feat/perfect-harness-v1]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install exact direct dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Pi contract
        run: npm run test:contract
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bootstrap-package-lock
          path: package-lock.json
