name: Perfect V4 historical regression
# V4 is immutable. This workflow is read-only and cannot publish on main.
# V5 publication must use its own complete acceptance and binary gates.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: perfect-v4-regression-${{ github.sha }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/v4-checks.yml
  blender:
    uses: ./.github/workflows/v4-blender.yml
  ui:
    uses: ./.github/workflows/v4-ui.yml
  windows:
    uses: ./.github/workflows/v4-windows.yml
