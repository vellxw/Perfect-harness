name: V4 source compatibility gate (temporary)
on:
  push:
    branches: [feat/perfect-harness-v4-skills-studios]
    paths: [src/**, tests/**, scripts/v4-wire-core.mjs, .github/workflows/v4-source-gate.yml]
permissions:
  contents: write
jobs:
  gate:
    if: github.repository == 'vellxw/Perfect-harness' && github.ref == 'refs/heads/feat/perfect-harness-v4-skills-studios'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26.4.0'
      - run: npm ci
      - run: node scripts/v4-wire-core.mjs
      - run: npm install --save-exact --ignore-scripts yaml@2.8.2
      - name: Formatear código nuevo y adaptaciones
        run: |
          npx --no-install prettier --write src/skills src/agents src/application src/domain/model.ts src/ports src/adapters/pi/tools.ts src/adapters/pi/runtime.ts src/adapters/sqlite/store.ts src/integrations/wire.ts src/tools/paths.ts tests/skills
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:config
      - run: npm run build
      - run: npm test
      - run: npm run test:package
      - run: npm run audit:production
      - name: Preparar árbol validado sin actualizar ramas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import pathlib,json,subprocess,base64,os
          names=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          entries=[]
          for name in names:
            assert name.startswith(('src/','tests/')) or name in ['package.json','package-lock.json']
            p=pathlib.Path(name);assert p.is_file() and not p.is_symlink()
            blob=json.loads(subprocess.check_output(['gh','api','--method','POST','repos/vellxw/Perfect-harness/git/blobs','--input','-'],input=json.dumps({'encoding':'base64','content':base64.b64encode(p.read_bytes()).decode()}),text=True))['sha']
            entries.append({'path':name,'mode':'100644','type':'blob','sha':blob})
          tree=json.loads(subprocess.check_output(['gh','api','--method','POST','repos/vellxw/Perfect-harness/git/trees','--input','-'],input=json.dumps({'base_tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'tree':entries}),text=True))['sha']
          print('VALIDATED_TREE='+tree);print('PARENT='+os.environ['GITHUB_SHA'])
          pathlib.Path('test-results').mkdir(exist_ok=True)
          pathlib.Path('test-results/validated-source.json').write_text(json.dumps({'tree':tree,'parent':os.environ['GITHUB_SHA'],'files':names},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v4-source-validation
          path: test-results
          retention-days: 7
