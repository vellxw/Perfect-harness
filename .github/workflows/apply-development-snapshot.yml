name: Apply verified development snapshot (temporary)
on:
  push:
    branches: [feat/perfect-harness-v1]
    paths: [.github/workflows/apply-development-snapshot.yml]
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'vellxw/Perfect-harness' && github.ref == 'refs/heads/feat/perfect-harness-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reconstruct only prevalidated source files from fixed repository blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          blobs = [
            'a26c6fd7dfd17f183c26c541b3b9683e242ab21d',
            '1f3710d7ca4f8124998efff80ae887ed919f861b',
            'c36a1beaecd4e05ef959e9565b8480cc7857a5ca',
            '0869fdcf347e967c7b753ea256b7f1bebce3d658',
            'a891d7dc5c58bc7166d08fcf9a6d23297c920869',
            'a079941a00d018a0abefbc2b1205cc6a8510c4a8',
            '12aedff8c6ab9ab4cd6597a5a3d89d3c0611c13a',
            'fd1f8554cc80632474f7d755de5565ac5d8ef56a',
          ]
          def blob_hash(data):
            return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          chunks = []
          for sha in blobs:
            response = json.loads(subprocess.check_output(['gh', 'api', 'repos/vellxw/Perfect-harness/git/blobs/' + sha]))
            data = base64.b64decode(response['content'])
            assert blob_hash(data) == sha
            chunks.append(data)
          compressed = b''.join(chunks)
          assert hashlib.sha256(compressed).hexdigest() == '175993be9355ff14c353af941b8d4319172fef1ca809be18a95fdee7c794689f'
          decoder = lzma.LZMADecompressor(memlimit=256*1024*1024)
          raw = decoder.decompress(compressed, max_length=2_000_000)
          assert decoder.eof and not decoder.unused_data
          entries = json.loads(raw)
          assert len(entries) == 71
          roots = {'src', 'tests', 'docs', 'examples', 'scripts'}
          root_files = {'.nvmrc', 'CONTRIBUTING.md', 'LICENSE', 'README.md', 'SECURITY.md', 'package.json', 'perfect.config.example.json', 'perfect.config.schema.json'}
          updates, names = [], set()
          for entry in entries:
            name = entry['path']
            path = pathlib.PurePosixPath(name)
            assert str(path) == name and not path.is_absolute() and '..' not in path.parts
            assert name in root_files or (len(path.parts) > 1 and path.parts[0] in roots)
            assert name not in names
            names.add(name)
            target = pathlib.Path(name)
            assert not target.is_symlink() and all(not p.is_symlink() for p in target.parents)
            before = target.read_bytes() if target.is_file() else None
            assert (blob_hash(before) if before is not None else None) == entry['before'], name + ': base mismatch'
            lines = (before or b'').decode('utf-8').splitlines(keepends=True)
            last = len(lines) + 1
            for start, count, text in reversed(entry['edits']):
              assert isinstance(start, int) and isinstance(count, int) and start >= 0 and count >= 0
              assert start + count <= len(lines) and start + count < last
              lines[start:start + count] = text.splitlines(keepends=True)
              last = start + 1
            after = ''.join(lines).encode('utf-8') if entry['after'] is not None else None
            assert (blob_hash(after) if after is not None else None) == entry['after'], name + ': output mismatch'
            updates.append((target, after))
          for target, content in updates:
            if content is None:
              target.unlink()
            else:
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(content)
              target.chmod(0o644)
          subprocess.run(['git', 'add', '--', *sorted(names)], check=True)
          print('Verified and staged', len(updates), 'source files; no workflows, credentials or Git configuration in delta.')
          PY
      - run: npm ci
      - name: Validate materialized source
        run: |
          npm run typecheck
          npm run lint
          npm run check:config
          npm test
          npm run build
          git diff --cached --check
      - name: Commit and fast-forward only the authorized branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'Perfect Harness Publisher'
          git config user.email 'perfect-harness@users.noreply.github.com'
          git commit -m 'feat: harden evidence goal loop, transport identity, recovery and visual rendering'
          AUTH_HEADER=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH_HEADER"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH_HEADER" push origin HEAD:refs/heads/feat/perfect-harness-v1
          git rev-parse HEAD
