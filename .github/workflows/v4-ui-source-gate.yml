name: V4 UI source gate (temporary)
on:
  push:
    branches: [feat/perfect-harness-v4-skills-studios]
    paths: [scripts/v4-wire-ui.mjs, scripts/v4-prepare-ui.mjs, .github/workflows/v4-ui-source-gate.yml]
permissions:
  contents: write
jobs:
  gate:
    if: github.repository == 'vellxw/Perfect-harness' && github.ref == 'refs/heads/feat/perfect-harness-v4-skills-studios'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26.4.0'
      - run: npm ci
      - run: node scripts/v4-prepare-ui.mjs
      - run: npm install --save-exact --ignore-scripts yaml@2.9.1
      - run: npx --no-install prettier --write src/skills src/cli/skills.ts src/cli/main.ts src/presentation/engine.ts src/presentation/protocol.ts src/ui/tui src/i18n/es.ts src/application/goals.ts src/integrations/wire.ts tests/skills
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:config
      - run: npm run build
      - run: npm test
      - run: npm run test:package
      - run: npm audit --omit=dev --audit-level=moderate
      - name: Preparar código probado sin modificar refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import pathlib,json,subprocess,base64,os
          names=[n for n in subprocess.check_output(['git','diff','--name-only'],text=True).splitlines() if not n.startswith('scripts/')];entries=[]
          for name in names:
            assert name.startswith(('src/','tests/')) or name in ['package.json','package-lock.json']
            p=pathlib.Path(name);assert p.is_file() and not p.is_symlink()
            blob=json.loads(subprocess.check_output(['gh','api','--method','POST','repos/vellxw/Perfect-harness/git/blobs','--input','-'],input=json.dumps({'encoding':'base64','content':base64.b64encode(p.read_bytes()).decode()}),text=True))['sha']
            entries.append({'path':name,'mode':'100644','type':'blob','sha':blob})
          tree=json.loads(subprocess.check_output(['gh','api','--method','POST','repos/vellxw/Perfect-harness/git/trees','--input','-'],input=json.dumps({'base_tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'tree':entries}),text=True))['sha']
          print('VALIDATED_TREE='+tree);print('PARENT='+os.environ['GITHUB_SHA'])
          pathlib.Path('test-results').mkdir(exist_ok=True)
          pathlib.Path('test-results/validated-source.json').write_text(json.dumps({'tree':tree,'parent':os.environ['GITHUB_SHA'],'files':names},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v4-ui-source-validation
          path: test-results
          retention-days: 7
