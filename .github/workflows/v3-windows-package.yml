name: 'V3 Windows: paquete e instalación'
on:
  push:
    branches: [feat/perfect-harness-v3-integraciones]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v3-windows-package-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-package:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      WINAPP_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26.4.0'
      - run: npm ci
      - name: Compilar el instalador español y los módulos de escritorio
        shell: pwsh
        run: |
          if (-not (Get-ChildItem "${env:ProgramFiles(x86)}/Inno Setup*/ISCC.exe" -ErrorAction SilentlyContinue)) {
            choco install innosetup --version=6.7.0 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'No se pudo preparar el compilador de instalación' }
          }
          ./scripts/package-windows.ps1 -Installer
      - name: Probar instalación, versión, perfil e integraciones
        shell: pwsh
        run: |
          ./scripts/smoke-windows.ps1 -Installer
          $root=Resolve-Path 'release/Perfect-Harness-Windows-x64'
          $help=& "$root/Perfect.exe" --no-ui integraciones --help
          if($LASTEXITCODE -ne 0 -or ($help -join "`n") -notmatch 'GitHub'){throw 'La CLI instalada no incluye integraciones'}
          foreach($name in @('winapp.exe','Perfect.DesktopGuard.exe','Perfect.DesktopElementGuard.exe','Perfect.CredentialVault.exe','WinApp-LICENSE.txt')) {
            if(-not(Test-Path "$root/assets/windows/desktop/$name")){throw "Falta módulo nativo $name"}
          }
          $version=(Get-Content package.json -Raw | ConvertFrom-Json).version
          @{version=$version;commit=$env:GITHUB_SHA;platform='Windows Server 2025';personalAccountsTested=$false;checks=@('installer','uninstaller','profile','integrations CLI','native desktop modules')} | ConvertTo-Json -Depth 4 | Set-Content 'release/V3-validation.json' -Encoding utf8NoBOM
      - name: Capturar el iniciador real en Windows Terminal
        shell: pwsh
        run: ./scripts/capture-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Perfect-V3-Windows-Espanol-Instalador
          path: |
            release/*Setup*.exe
            release/SHA256SUMS.txt
            release/V3-validation.json
          compression-level: 0
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: Perfect-V3-Windows-Espanol-Portable
          path: |
            release/*.zip
            release/SHA256SUMS.txt
            release/V3-validation.json
          compression-level: 0
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Perfect-V3-Windows-Capturas
          path: test-results/windows-desktop
          retention-days: 30
