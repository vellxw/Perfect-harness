name: V3 integraciones y regresiones
on:
  push:
    branches: [feat/perfect-harness-v3-integraciones]
  pull_request:
    branches: [feat/perfect-harness-v2-tui-windows]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v3-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26.4.0'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run audit:production
      - name: Informar vulnerabilidades sin cambiar versiones automáticamente
        if: always()
        run: npm audit --omit=dev --json > audit.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-audit
          path: audit.json
