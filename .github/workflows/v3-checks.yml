name: V3 integraciones y regresiones
on:
  push:
    branches: [feat/perfect-harness-v3-integraciones]
  pull_request:
    branches: [feat/perfect-harness-v2-tui-windows]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v3-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26.4.0'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:config
      - run: npm run build
      - run: npm test
      - run: npm run test:package
      - run: npm run audit:production
      - name: Capturar paneles reales de integración con datos sintéticos
        run: node --experimental-ffi scripts/capture-integrations.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V3-Interfaz-${{ matrix.os }}
          path: test-results/integrations-ui
          retention-days: 30
