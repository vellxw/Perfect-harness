name: Perfect V4 Windows distribution
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: v4-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-package:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      WINAPP_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26.4.0'
      - name: Compile desktop fixtures using resolved Windows paths
        shell: pwsh
        run: |
          $framework=Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319'
          $compiler=Join-Path $framework 'csc.exe'
          $fixtureSource=(Resolve-Path -LiteralPath 'tests/windows/DesktopFixture.cs').Path
          $launcherSource=(Resolve-Path -LiteralPath 'tests/windows/StartUnelevated.cs').Path
          # This exact basename is the restricted launcher's existing allowlist.
          $fixtureExe=Join-Path $env:RUNNER_TEMP 'PerfectDesktopFixture.exe'
          $launcherExe=Join-Path $env:RUNNER_TEMP 'Perfect.StartUnelevated.exe'
          & $compiler /nologo /target:winexe /platform:x64 /reference:System.Windows.Forms.dll /reference:System.Drawing.dll "/out:$fixtureExe" $fixtureSource
          if($LASTEXITCODE -ne 0 -or -not(Test-Path -LiteralPath $fixtureExe -PathType Leaf)){throw 'Desktop fixture did not compile'}
          & $compiler /nologo /target:exe /platform:x64 "/out:$launcherExe" $launcherSource
          if($LASTEXITCODE -ne 0 -or -not(Test-Path -LiteralPath $launcherExe -PathType Leaf)){throw 'Fixture launcher did not compile'}
          "PERFECT_DESKTOP_FIXTURE=$fixtureExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PERFECT_DESKTOP_LAUNCHER=$launcherExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: npm ci
      - name: Exercise real desktop guards before expensive packaging
        shell: pwsh
        run: |
          ./scripts/prepare-desktop.ps1
          node --import tsx scripts/desktop-contract-diagnose.mjs
          if($LASTEXITCODE -ne 0){throw 'Native desktop contract failed'}
      - name: Prepare pinned Inno Setup 7 with extended path support
        shell: pwsh
        run: ./scripts/prepare-installer.ps1
      - uses: actions/checkout@v4
        with:
          ref: '1f3876b481a10c096ec7423541696ecd2a603306'
          path: previous-version
          persist-credentials: false
      - name: Build actual previous installer for upgrade test
        shell: pwsh
        run: |
          $log=Join-Path $env:RUNNER_TEMP 'perfect-previous-build.log'
          $processDirectory=[Environment]::CurrentDirectory
          Push-Location previous-version
          try {
            # The historical preparation script resolves relative paths through .NET.
            # Preserve its source and reproduce its original standalone checkout environment.
            [Environment]::CurrentDirectory=$PWD.Path
            npm ci
            if($LASTEXITCODE -ne 0){throw 'Previous install failed'}
            try {
              ./scripts/package-windows.ps1 *> $log
              $payload=(Resolve-Path 'release/Perfect-Harness-Windows-x64').Path
              $output=(Resolve-Path release).Path
              foreach($name in @('Perfect.CredentialVault.exe','Perfect.DesktopGuard.exe','Perfect.DesktopElementGuard.exe','winapp.exe','libSkiaSharp.dll')){
                if(-not(Test-Path (Join-Path $payload "assets/windows/desktop/$name") -PathType Leaf)){throw "Historical payload missing native helper: $name"}
              }
              & $env:PERFECT_ISCC /Qp "/DPayload=$payload" "/DOutput=$output" build/windows/perfect.iss *>> $log
              if($LASTEXITCODE -ne 0){throw 'Previous installer compilation failed'}
            } catch { Get-Content $log -Tail 60; throw }
            Copy-Item release/Perfect-Harness-Setup-x64.exe "$env:RUNNER_TEMP/Perfect-Previous-0.3.0.exe"
            Get-Content $log -Tail 5
          } finally {
            [Environment]::CurrentDirectory=$processDirectory
            Pop-Location
          }
          Remove-Item previous-version -Recurse -Force
      - name: Build V4 installer and portable once
        shell: pwsh
        run: |
          $log=Join-Path $env:RUNNER_TEMP 'perfect-v4-build.log'
          try { ./scripts/package-windows.ps1 -Installer *> $log }
          catch { Get-Content $log -Tail 60; throw }
          Get-Content $log -Tail 5
          foreach($name in @('Perfect.CredentialVault.exe','Perfect.DesktopGuard.exe','Perfect.DesktopElementGuard.exe','winapp.exe','libSkiaSharp.dll')){
            if(-not(Test-Path "release/Perfect-Harness-Windows-x64/assets/windows/desktop/$name" -PathType Leaf)){throw "V4 payload missing native helper: $name"}
          }
      - name: Test actual portable and installed payload plus upgrade
        shell: pwsh
        run: |
          ./scripts/smoke-windows.ps1 -Installer
          ./scripts/smoke-v4-windows.ps1 -PreviousInstaller "$env:RUNNER_TEMP/Perfect-Previous-0.3.0.exe" -Capture
      - uses: actions/upload-artifact@v4
        with:
          name: Perfect-V4-Windows-Espanol-Instalador
          path: |
            release/*Setup*.exe
            release/SHA256SUMS.txt
            release/Perfect-Harness-Windows-x64/build-manifest.json
            test-results/windows-installation/report.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: Perfect-V4-Windows-Espanol-Portable
          path: |
            release/*.zip
            release/SHA256SUMS.txt
            release/Perfect-Harness-Windows-x64/build-manifest.json
            test-results/windows-installation/report.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Perfect-V4-Windows-Capturas-y-Pruebas
          path: |
            test-results/windows-installed
            test-results/windows-installation
            test-results/desktop
          if-no-files-found: warn
          retention-days: 30
