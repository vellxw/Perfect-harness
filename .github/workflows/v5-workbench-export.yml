name: V5 local source continuation (temporary)
on:
  push:
    branches: [feat/perfect-desktop-v5]
    paths: [.github/workflows/v5-workbench-export.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Export tracked source and Git objects only
        run: |
          mkdir -p "$RUNNER_TEMP/perfect-v5-source"
          git bundle create "$RUNNER_TEMP/perfect-v5-source/history.bundle" --all
          git rev-parse HEAD > "$RUNNER_TEMP/perfect-v5-source/SOURCE_COMMIT"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/perfect-v5-source/SOURCE_TREE"
          sha256sum "$RUNNER_TEMP/perfect-v5-source/history.bundle"
      - uses: actions/upload-artifact@v4
        with:
          name: perfect-v5-current-source
          path: ${{ runner.temp }}/perfect-v5-source
          retention-days: 3
          compression-level: 0
