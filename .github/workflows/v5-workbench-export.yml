name: V5 local workbench export (temporary)
on:
  push:
    branches: [feat/perfect-desktop-v5]
    paths: [.github/workflows/v5-workbench-export.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26.4.0'
      - run: npm ci
      - name: Download the pinned official Electron distribution and Playwright recorder
        run: |
          node node_modules/electron/install.js
          node node_modules/playwright/cli.js install ffmpeg
      - name: Archive only downloaded test runtime binaries
        run: |
          mkdir -p "$RUNNER_TEMP/perfect-v5-binaries/electron" "$RUNNER_TEMP/perfect-v5-binaries/playwright"
          cp -R node_modules/electron/dist "$RUNNER_TEMP/perfect-v5-binaries/electron/"
          cp node_modules/electron/path.txt "$RUNNER_TEMP/perfect-v5-binaries/electron/"
          cp -R "$HOME"/.cache/ms-playwright/ffmpeg-* "$RUNNER_TEMP/perfect-v5-binaries/playwright/"
          tar -czf "$RUNNER_TEMP/perfect-v5-binaries.tar.gz" -C "$RUNNER_TEMP/perfect-v5-binaries" .
          sha256sum "$RUNNER_TEMP/perfect-v5-binaries.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: perfect-v5-local-binaries
          path: ${{ runner.temp }}/perfect-v5-binaries.tar.gz
          retention-days: 3
          compression-level: 0
