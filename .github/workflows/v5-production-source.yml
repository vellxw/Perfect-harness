name: V5 production bridge gate (temporary)
on:
  push:
    branches: [feat/perfect-desktop-v5]
    paths: [scripts/desktop/connect-production.mjs, scripts/desktop/prepare-production.mjs, .github/workflows/v5-production-source.yml]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26.4.0'
      - run: npm ci
      - name: Recover pending authored source once
        run: node scripts/desktop/prepare-production.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Preserve DOM JSX and backward-compatible goal input
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import ts from 'typescript';
          const ui='src/desktop/renderer/index.tsx';
          fs.writeFileSync(ui,'/** @jsxImportSource react */\n'+fs.readFileSync(ui,'utf8').replaceAll('/** @jsxImportSource react */',''));
          const path='src/presentation/protocol.ts',source=fs.readFileSync(path,'utf8'),file=ts.createSourceFile(path,source,ts.ScriptTarget.Latest,true),matches=[];
          function visit(n){if(ts.isPropertyAssignment(n)&&n.name.getText(file)==='referenceIds')matches.push(n.initializer);ts.forEachChild(n,visit);}visit(file);
          if(matches.length!==1)throw Error('Expected one referenceIds schema, found '+matches.length);
          const n=matches[0];
          if(!ts.isCallExpression(n)||!ts.isPropertyAccessExpression(n.expression))throw Error('Expected reference schema call');
          if(n.expression.name.text==='default')fs.writeFileSync(path,source.slice(0,n.getStart(file))+n.expression.expression.getText(file)+'.optional()'+source.slice(n.end));
          else if(n.expression.name.text!=='optional')throw Error('Unexpected referenceIds schema: '+n.getText(file));
          JS
      - run: npx --no-install prettier --write src tests/desktop
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:config
      - run: npm run build:desktop
      - run: npm test
      - run: node node_modules/electron/install.js
      - run: node node_modules/playwright/cli.js install ffmpeg
      - run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2t64
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - run: xvfb-run -a -s '-screen 0 1920x1080x24' node scripts/desktop/ui-e2e.mjs
      - name: Export the exact tested source diff
        run: |
          mkdir -p test-results/desktop
          git add --intent-to-add src tests/desktop
          git diff --binary -- src tests/desktop scripts/desktop/build.mjs > test-results/desktop/validated.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v5-production-bridge
          path: test-results/desktop
          retention-days: 14
  stage:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: v5-production-bridge
          path: validated
      - name: Stage the exact tested patch, without updating refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git apply --check validated/validated.patch
          git apply validated/validated.patch
          python3 - <<'PY'
          import pathlib,json,subprocess,base64,os
          names=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          names.update(subprocess.check_output(['git','ls-files','--others','--exclude-standard','src','tests/desktop'],text=True).splitlines())
          entries=[]
          for name in sorted(names):
            assert name.startswith(('src/','tests/desktop/')) or name=='scripts/desktop/build.mjs'
            p=pathlib.Path(name);assert p.is_file() and not p.is_symlink() and p.stat().st_size<6000000
            blob=json.loads(subprocess.check_output(['gh','api','--method','POST','repos/vellxw/Perfect-harness/git/blobs','--input','-'],input=json.dumps({'encoding':'base64','content':base64.b64encode(p.read_bytes()).decode()}),text=True))['sha']
            entries.append({'path':name,'mode':'100644','type':'blob','sha':blob})
          tree=json.loads(subprocess.check_output(['gh','api','--method','POST','repos/vellxw/Perfect-harness/git/trees','--input','-'],input=json.dumps({'base_tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'tree':entries}),text=True))['sha']
          print('VALIDATED_TREE='+tree);print('PARENT='+os.environ['GITHUB_SHA'])
          PY
