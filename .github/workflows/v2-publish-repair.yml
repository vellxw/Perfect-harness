name: Publish exact V2 repair (temporary)
on:
  push:
    branches: [feat/perfect-harness-v2-tui-windows]
    paths: [.github/workflows/v2-publish-repair.yml]
permissions:
  contents: write
jobs:
  repair:
    if: github.repository == 'vellxw/Perfect-harness' && github.ref == 'refs/heads/feat/perfect-harness-v2-tui-windows'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26.4.0'
      - run: npm ci
      - name: Materialize observed fixes, never modify acceptance tests to skip them
        run: |
          node scripts/v2-repair-01.mjs
          npx --no-install prettier --write src/presentation src/ui src/windows/Perfect.cs src/tools/evidence.ts src/config/load.ts tests/tui --ignore-unknown
      - name: Compile and test
        id: check
        continue-on-error: true
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build
      - name: Publish source, preserving exact history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -- src/ui/tui/app.tsx tests/tui src/presentation src/tools/evidence.ts src/config/load.ts scripts/capture-tui.mjs scripts/package-windows.ps1 src/windows/Perfect.cs
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'Perfect Harness Publisher'
          git config user.email 'perfect-harness@users.noreply.github.com'
          git commit -m 'fix(v2): preserve latest activity, correct input contract and normalize Windows evidence paths'
          AUTH_HEADER=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH_HEADER"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH_HEADER" push origin HEAD:refs/heads/feat/perfect-harness-v2-tui-windows
      - if: steps.check.outcome != 'success'
        run: exit 1
