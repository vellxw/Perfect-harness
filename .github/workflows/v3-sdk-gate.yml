name: Compatibilidad MCP V3 (temporal)
on:
  push:
    branches: [feat/perfect-harness-v3-integraciones]
    paths: [.github/workflows/v3-sdk-gate.yml]
permissions:
  contents: write
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26.4.0'
      - run: npm ci
      - name: Fijar SDK publicado y comprobar contrato real stdio
        run: |
          npm install --save-exact @modelcontextprotocol/client@2.0.0 @modelcontextprotocol/server@2.0.0 ajv@8.17.1
          mkdir -p test-results
          cat > test-results/mcp-contract-server.mjs <<'JS'
          import {McpServer} from '@modelcontextprotocol/server';
          import {StdioServerTransport} from '@modelcontextprotocol/server/stdio';
          import {z} from 'zod';
          const s=new McpServer({name:'perfect-contract',version:'1.0.0'});
          s.registerTool('echo',{description:'Herramienta de prueba sin efectos externos',inputSchema:z.object({text:z.string()})},async({text})=>({content:[{type:'text',text}]}));
          await s.connect(new StdioServerTransport());
          JS
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {Client,StreamableHTTPClientTransport} from '@modelcontextprotocol/client';
          import {StdioClientTransport} from '@modelcontextprotocol/client/stdio';
          const client=new Client({name:'perfect-gate',version:'0.3.0'},{capabilities:{}});
          const transport=new StdioClientTransport({command:process.execPath,args:['test-results/mcp-contract-server.mjs'],env:{PATH:process.env.PATH},stderr:'pipe'});
          try {await client.connect(transport);const tools=await client.listTools();assert.equal(tools.tools[0].name,'echo');const result=await client.callTool({name:'echo',arguments:{text:'Español: conexión real MCP'}},{timeout:5000});assert.equal(result.content[0].text,'Español: conexión real MCP');assert.equal(typeof StreamableHTTPClientTransport,'function');console.log('MCP_CLIENT_SERVER_STDIO_CONTRACT_PASS');console.log(JSON.stringify({server:client.getServerVersion(),tools:tools.tools},null,2));}finally{await client.close();}
          JS
      - run: npm run typecheck && npm test && npm run build
      - name: Crear solo blobs de manifiestos; no modificar refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,subprocess,base64,pathlib,os
          result={'parent':os.environ['GITHUB_SHA'],'files':{}}
          for name in ['package.json','package-lock.json']:
            payload=json.dumps({'encoding':'base64','content':base64.b64encode(pathlib.Path(name).read_bytes()).decode()})
            response=json.loads(subprocess.check_output(['gh','api','--method','POST','repos/vellxw/Perfect-harness/git/blobs','--input','-'],input=payload,text=True))
            result['files'][name]=response['sha']
          pathlib.Path('test-results/mcp-dependencies.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcp-sdk-gate
          path: test-results/mcp-dependencies.json
          retention-days: 7
