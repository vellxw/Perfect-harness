name: V2 UI and Windows checks
on:
  push:
    branches: [main, feat/perfect-harness-v2-tui-windows]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v2-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26.4.0'
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Schema synchronization
        run: npm run check:config
      - name: Core and native UI tests
        run: npm test
        env:
          PERFECT_ARTIFACT_DIR: test-results/tui
      - name: Build
        run: npm run build
      - name: Clean package installation
        run: npm run test:package
      - name: Native captures, icon assets and measured performance
        run: |
          node scripts/build-brand.mjs
          node --experimental-ffi scripts/capture-tui.mjs
          node --experimental-ffi scripts/benchmark-tui.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ui-${{ matrix.os }}
          path: |
            test-results/tui
            test-results/performance
            assets/brand
          retention-days: 14
