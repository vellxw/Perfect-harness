name: Development diagnostics
on:
  workflow_dispatch:
  push:
    branches: [feat/perfect-harness-v1]
    paths: [.github/workflows/development-diagnostics.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Export source and installed SDK without Git, credentials or environment
        run: |
          mkdir -p /tmp/perfect-diagnostics/runtime
          git archive HEAD | tar -x -C /tmp/perfect-diagnostics
          cp "$(command -v node)" /tmp/perfect-diagnostics/runtime/node
          tar -czf /tmp/perfect-diagnostics/dependencies.tar.gz node_modules
          git rev-parse HEAD > /tmp/perfect-diagnostics/SOURCE_COMMIT
          tar -czf /tmp/perfect-development.tar.gz -C /tmp/perfect-diagnostics .
      - uses: actions/upload-artifact@v4
        with:
          name: perfect-development
          path: /tmp/perfect-development.tar.gz
          retention-days: 3
          compression-level: 0
