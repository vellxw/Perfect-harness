name: V2 core sandbox end-to-end
on:
  push:
    branches: [feat/perfect-harness-v2-tui-windows]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v2-docker-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fullstack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26.4.0'
      - run: npm ci
      - run: |
          docker pull node:24-bookworm-slim
          docker pull mcr.microsoft.com/playwright:v1.63.0-noble
      - name: Real isolated API/browser/repair and Remotion render, simulated providers
        run: npm run test:e2e
        env:
          PERFECT_TEST_DOCKER: '1'
          PERFECT_ARTIFACT_DIR: test-results/fullstack
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-fullstack-evidence
          path: test-results/fullstack
          retention-days: 14
